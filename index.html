<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Network - SPA</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" />

    <!-- Cropper.js Script -->
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>

    <!-- Realtime Chat -->
    <script src="./node_modules/sockjs-client/dist/sockjs.min.js"></script>
    <script src="./node_modules/@stomp/stompjs/bundles/stomp.umd.min.js"></script>

    <!-- Custom Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#3b82f6",
              secondary: "#64748b",
            },
          },
        },
      };
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Global error handler for debugging blank page issues
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Global Error:', msg, 'at', url, ':', lineNo);
        const app = document.getElementById('app');
        if (app && !app.innerHTML.trim()) {
           app.innerHTML = `
            <div class="p-8 text-center">
              <h1 class="text-xl font-bold text-red-600">Lỗi loading ứng dụng</h1>
              <p class="text-gray-600 mt-2">${msg}</p>
              <p class="text-xs text-gray-400 mt-4">${url}:${lineNo}</p>
            </div>
           `;
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        console.error('Unhandled Promise Rejection:', event.reason);
      };
    </script>
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Highlight animation for notifications */
      @keyframes highlight-fade {
        0% { background-color: rgba(59, 130, 246, 0.2); }
        100% { background-color: transparent; }
      }
      .highlight-notification {
        animation: highlight-fade 3s ease-in-out;
        border-radius: 0.5rem;
      }

      /* Transitions & Animations */
      @keyframes slide-down {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes scale-up {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
      }
      
      .animate-slide-down {
        animation: slide-down 0.25s cubic-bezier(0, 0, 0.2, 1) forwards;
      }
      .animate-fade-in {
        animation: fade-in 0.2s ease-out forwards;
      }
      .animate-scale-up {
        animation: scale-up 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      .comment-bubble-transition {
        transition: background-color 0.2s ease, transform 0.1s ease;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- App Root -->
    <div id="app" class="min-h-screen"></div>

    <!-- Loading Spinner (Optional) -->
    <div
      id="loading"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    >
      <div class="bg-white p-6 rounded-lg shadow-xl">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto"></div>
        <p class="mt-4 text-gray-600">Đang tải...</p>
      </div>
    </div>

    <!-- Application Bootstrap -->
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
